- name: HydroPol2D
  category_en: Flood and water-quality modeling
  category_pt: Modelagem de inundacoes e qualidade da agua
  summary_en: An open two-dimensional model for rainfall-runoff, flood movement, infiltration, shallow groundwater, reservoirs, dam-breaks, snow, and pollutant transport.
  summary_pt: Um modelo bidimensional aberto para chuva-vazao, propagacao de inundacoes, infiltracao, agua subterranea rasa, reservatorios, rompimentos de barragens, neve e transporte de poluentes.
  image: /files/Rain_on_the_grid.gif
  image_alt_en: HydroPol2D simulation of rainfall and surface flow in an urban catchment
  image_alt_pt: Simulacao do HydroPol2D de chuva e escoamento superficial em uma bacia urbana
  primary_url: https://marcusnobrega-eng.github.io/HydroPol2D-docs/
  repository: https://github.com/marcusnobrega-eng/HydroPol2D
  documentation: https://marcusnobrega-eng.github.io/HydroPol2D-docs/
  publication: https://doi.org/10.1016/j.jhydrol.2023.129982

- name: MIRA
  category_en: Regional multi-hazard evidence
  category_pt: Evidencias regionais de multiplos perigos
  summary_en: An interactive South American platform that compares flood, drought, wildfire, and socioeconomic exposure at one-kilometer resolution.
  summary_pt: Uma plataforma interativa para a America do Sul que compara inundacoes, secas, incendios e exposicao socioeconomica em resolucao de um quilometro.
  image: /images/mira-atlas.png
  image_alt_en: MIRA map of modeled flood hazard across South America
  image_alt_pt: Mapa do MIRA de perigo de inundacao modelado na America do Sul
  primary_url: https://riskframeworksa.github.io/data_viewer/

- name: GRIDF
  category_en: Rainfall extremes
  category_pt: Extremos de precipitacao
  summary_en: Code and a web application for estimating and mapping rainfall intensity, duration, and frequency across Brazil from gridded and satellite data.
  summary_pt: Codigo e aplicativo web para estimar e mapear intensidade, duracao e frequencia da chuva no Brasil a partir de dados em grade e de satelite.
  image: https://github.com/user-attachments/assets/1090dd66-fa1f-47b7-9207-df39a5387208
  image_alt_en: GRIDF interface and rainfall-frequency outputs
  image_alt_pt: Interface do GRIDF e resultados de frequencia de chuva
  primary_url: https://gridf-470516.projects.earthengine.app/view/gridf-br
  repository: https://github.com/marcusnobrega-eng/GRIDF

- name: Huff Curves BR Atlas
  category_en: Rainfall timing
  category_pt: Distribuicao temporal da chuva
  summary_en: A national atlas for examining how heavy rainfall is distributed through time and how storm timing can alter flood response.
  summary_pt: Um atlas nacional para examinar como chuvas intensas se distribuem no tempo e como essa distribuicao pode alterar a resposta a inundacoes.
  image: /images/huff-curves-atlas.png
  image_alt_en: Huff Curves BR Atlas showing rainfall stations and temporal-distribution classes across Brazil
  image_alt_pt: Atlas Huff Curves BR com estacoes de chuva e classes de distribuicao temporal no Brasil
  primary_url: https://marcusnobrega-eng.github.io/Huff_Curves_BR/docs/

- name: LIMIAR
  category_en: Flood reconstruction
  category_pt: Reconstrucao de inundacoes
  summary_en: A national framework that combines river cross sections, water levels, discharge, and rating curves to reconstruct past floods in Brazil.
  summary_pt: Uma estrutura nacional que combina secoes de rios, niveis de agua, vazoes e curvas-chave para reconstruir inundacoes passadas no Brasil.
  image: /files/dam_break.gif
  image_alt_en: Simulated flood propagation used to illustrate flood reconstruction
  image_alt_pt: Propagacao simulada de inundacao usada para ilustrar a reconstrucao de cheias
  primary_url: https://marcusnobrega-eng.github.io/LIMIAR/
  repository: https://github.com/marcusnobrega-eng/LIMIAR
  documentation: https://marcusnobrega-eng.github.io/LIMIAR/

- name: DRAIN-LID
  category_en: Nature-based drainage
  category_pt: Drenagem baseada na natureza
  summary_en: A one-dimensional model of saturated and unsaturated flow for permeable pavements, green roofs, and bioretention systems.
  summary_pt: Um modelo unidimensional de escoamento saturado e nao saturado para pavimentos permeaveis, telhados verdes e sistemas de biorretencao.
  image: https://github.com/user-attachments/assets/cf5fca6c-4d27-4e32-af86-5f17bf0261f6
  image_alt_en: DRAIN-LID representation of water movement through layered porous media
  image_alt_pt: Representacao do DRAIN-LID do movimento da agua em meios porosos estratificados
  primary_url: https://marcusnobrega-eng.github.io/DRAIN-LID/
  repository: https://github.com/marcusnobrega-eng/DRAIN-LID
  documentation: https://marcusnobrega-eng.github.io/DRAIN-LID/
  publication: https://doi.org/10.1016/j.envsoft.2025.106766

- name: India Flood Inventory Toolbox
  category_en: Historical flood evidence
  category_pt: Evidencias historicas de inundacoes
  summary_en: Tools for organizing and examining reported flood events in India from 1970 to 2023, including impacts on people and infrastructure.
  summary_pt: Ferramentas para organizar e examinar eventos de inundacao relatados na India entre 1970 e 2023, incluindo impactos sobre pessoas e infraestrutura.
  image: /images/utsa_rainrunoff.gif
  image_alt_en: Animated rainfall and runoff fields representing historical flood analysis
  image_alt_pt: Campos animados de chuva e escoamento que representam a analise historica de inundacoes
  primary_url: https://marcusnobrega-eng.github.io/IFI_Toolbox/
  repository: https://github.com/marcusnobrega-eng/IFI_Toolbox
  documentation: https://marcusnobrega-eng.github.io/IFI_Toolbox/
