{% include base_path %}

<!-- start custom head snippets -->

<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=M44lzPylqQ" color="#000000">
<link rel="shortcut icon" href="{{ '/images/favicon.ico' | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Marcus N. Gomes Jr.",
  "jobTitle": "Postdoctoral Researcher",
  "affiliation": {
    "@type": "Organization",
    "name": "Stanford University"
  },
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "email": "mailto:{{ site.author.email }}",
  "sameAs": [
    "{{ site.author.googlescholar }}",
    "{{ site.author.orcid }}",
    "https://github.com/{{ site.author.github }}",
    "{{ site.author.linkedin }}"
  ]
}
</script>

<!-- end custom head snippets -->
